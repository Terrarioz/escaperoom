<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermission 3</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@200;300;400&display=swap');

    :root {
      --bg: #020202;
      --sys-color: #a3be8c;   /* Stage 3 = green */
      --sub-color: #bf616a;   /* Red for unstable Subject 001 (now minimal) */
      --arch-color: #ebcb8b;  /* Gold for Architect (You) */
      --text-main: #eceff4;
      --stabilized-color: #a3be8c;
      --font-mono: 'Space Mono', monospace;
    }

    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: var(--bg); overflow: hidden;
      font-family: var(--font-mono); color: var(--text-main);
      user-select: none;
      opacity: 0; transition: opacity 1.5s ease;
    }

    /* Ambient Overlays */
    #bg-glow {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 75% 50%, rgba(163,190,140,0.08) 0%, rgba(2,2,2,1) 62%);
      z-index: 0; transition: 2s;
    }
    .scanlines {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
      pointer-events: none; z-index: 3;
    }
    #vignette {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; box-shadow: inset 0 0 150px rgba(0,0,0,0.8); z-index: 2;
    }
    #flash {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: white; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 1.5s ease;
    }

    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    /* Terminal UI */
    #terminal-container {
      position: absolute; left: 8%; top: 50%; transform: translateY(-50%);
      width: 45%; z-index: 10; font-size: 1.1vw; line-height: 2;
    }

    .inter-title {
      font-family: 'Inter', sans-serif; font-weight: 200; font-size: 1.5vw; letter-spacing: 5px;
      color: var(--text-main); margin-bottom: 30px;
      border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px;
    }

    .log-line {
      margin-bottom: 10px; opacity: 0;
      animation: fadeIn 0.1s forwards;
      text-shadow: 0 0 8px rgba(255,255,255,0.2);
    }
    .sys { color: var(--sys-color); }
    .sub { color: var(--sub-color); text-shadow: 0 0 10px var(--sub-color); }
    .arch { color: var(--arch-color); }
    .stabilized { color: var(--stabilized-color); text-shadow: 0 0 10px var(--stabilized-color); transition: color 1s; }

    /* Very mild glitch (Stage 3: almost coherent) */
    .glitch-text { display: inline-block; animation: textGlitch 0.9s infinite; }
    @keyframes textGlitch {
      0% { transform: translate(0); opacity: 1; }
      25% { transform: translate(-0.5px, 0.3px); opacity: 0.92; }
      50% { transform: translate(0.6px, -0.3px); opacity: 1; }
      75% { transform: translate(-0.3px, -0.5px); opacity: 0.95; }
      100% { transform: translate(0); opacity: 1; }
    }

    @keyframes fadeIn { to { opacity: 1; } }

    /* Interactive Architect Button */
    #reply-btn {
      display: none; margin-top: 20px;
      background: rgba(235, 203, 139, 0.05);
      border: 1px solid var(--arch-color); color: var(--arch-color);
      padding: 15px 20px; font-family: var(--font-mono); font-size: 1vw;
      cursor: pointer; text-align: left; width: 100%;
      transition: 0.3s; box-shadow: 0 0 10px rgba(235, 203, 139, 0.2);
    }
    #reply-btn:hover {
      background: rgba(235, 203, 139, 0.2);
      box-shadow: 0 0 20px rgba(235, 203, 139, 0.5);
      transform: translateX(10px);
    }

    .progress-bar {
      font-size: 1.2vw; letter-spacing: 5px; color: var(--text-main);
      margin-top: 30px; display: inline-block;
      background: rgba(255,255,255,0.05); padding: 10px 20px;
      border-left: 2px solid var(--sys-color);
    }
  </style>
</head>
<body>

  <div id="bg-glow"></div>
  <div class="scanlines"></div>
  <div id="vignette"></div>
  <div id="flash"></div>

  <canvas id="main-canvas"></canvas>

  <div id="terminal-container">
    <div class="inter-title">[ NEURAL RECONSTRUCTION LOG ]</div>
    <div id="dialogue-box"></div>
    <button id="reply-btn" onclick="architectReply()">> [ ARCHITECT: Stay in the loop. Let the center hold you. ]</button>
  </div>

<script>
  window.addEventListener('load', () => {
    document.documentElement.style.opacity = '1';
    document.body.style.opacity = '1';
  });

  // --- VISUAL THEME (Stage 3 / Green) ---
  const STAGE_RGB = { r: 163, g: 190, b: 140 }; // #a3be8c
  const STAGE_HEX = '#a3be8c';

  // --- 3D ENGINE (Core + Continuity Ring) ---
  const canvas = document.getElementById('main-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, cx, cy;
  let time = 0;

  // Core state
  let coreInstability = 0.85; // start already calmer than Stage 1/2
  let geometry = [];
  let continuity = { t: 0 };  // becomes 1.0 when stabilized, making the ring "close"

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cx = w * 0.75;
    cy = h / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  const FOV = 600;
  const VIEW_DIST = 5;

  function rotate3D(x, y, z, rx, ry, rz) {
    let cy1 = Math.cos(rx), sy1 = Math.sin(rx);
    let y1 = y * cy1 - z * sy1;
    let z1 = y * sy1 + z * cy1;

    let cx2 = Math.cos(ry), sx2 = Math.sin(ry);
    let x2 = x * cx2 + z1 * sx2;
    let z2 = -x * sx2 + z1 * cx2;

    let cx3 = Math.cos(rz), sx3 = Math.sin(rz);
    let x3 = x2 * cx3 - y1 * sx3;
    let y3 = x2 * sx3 + y1 * cx3;

    return { x: x3, y: y3, z: z2 };
  }

  function project(x, y, z) {
    let s = FOV / (FOV + z + VIEW_DIST);
    return { x: cx + x * s * 250, y: cy + y * s * 250, s };
  }

  // Generate wireframe sphere/core points
  for (let i = 0; i < 200; i++) {
    let phi = Math.acos(1 - 2 * (i + 0.5) / 200);
    let theta = Math.PI * (1 + Math.sqrt(5)) * i;
    geometry.push({
      x: Math.sin(phi) * Math.cos(theta),
      y: Math.sin(phi) * Math.sin(theta),
      z: Math.cos(phi)
    });
  }

  function animate() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(2, 2, 2, 0.30)';
    ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = 'lighter';
    time += 0.02;

    let rX = time * (0.25 + coreInstability * 0.7);
    let rY = time * (0.35 + coreInstability * 0.5);

    // --- Draw core wire + nodes ---
    ctx.beginPath();
    geometry.forEach((p, i) => {
      // smaller jitter (he's improving)
      let jX = (Math.random() - 0.5) * 0.12 * coreInstability;
      let jY = (Math.random() - 0.5) * 0.12 * coreInstability;
      let jZ = (Math.random() - 0.5) * 0.12 * coreInstability;

      let r = rotate3D(p.x + jX, p.y + jY, p.z + jZ, rX, rY, 0);
      let pj = project(r.x, r.y, r.z);

      if (pj.s > 0) {
        if (i === 0) ctx.moveTo(pj.x, pj.y);
        else if (i % 3 === 0) ctx.lineTo(pj.x, pj.y);

        const a = 0.22 + (1 - coreInstability) * 0.65;
        ctx.fillStyle = `rgba(${STAGE_RGB.r},${STAGE_RGB.g},${STAGE_RGB.b},${a})`;
        ctx.fillRect(pj.x, pj.y, pj.s * 3, pj.s * 3);
      }
    });

    const lineA = 0.08 + (1 - coreInstability) * 0.35;
    ctx.strokeStyle = `rgba(${STAGE_RGB.r},${STAGE_RGB.g},${STAGE_RGB.b},${lineA})`;
    ctx.lineWidth = 1;
    ctx.stroke();

    // --- Draw continuity ring (corpus callosum bridge) ---
    // Before stabilization: ring has a "gap" and slight wobble.
    const gapFrac = 0.35 * (1 - continuity.t);        // gap closes as t -> 1
    const seg = 120;
    const radius = 1.35 + 0.1 * Math.sin(time * 0.7);
    const wobble = 0.20 * (1 - continuity.t);

    ctx.beginPath();
    let started = false;
    for (let i = 0; i <= seg; i++) {
      const frac = i / seg;
      if (frac < gapFrac) continue; // create the gap at start

      const a = frac * Math.PI * 2;
      const x = Math.cos(a) * radius;
      const y = Math.sin(a) * radius + Math.sin(time * 3 + a) * wobble;
      const z = Math.cos(time * 0.8 + a) * wobble;

      const rr = rotate3D(x, y, z, rX * 0.7, rY * 0.7, time * 0.2);
      const pj = project(rr.x, rr.y, rr.z);

      if (pj.s > 0) {
        if (!started) { ctx.moveTo(pj.x, pj.y); started = true; }
        else ctx.lineTo(pj.x, pj.y);
      }
    }
    ctx.strokeStyle = `rgba(${STAGE_RGB.r},${STAGE_RGB.g},${STAGE_RGB.b},${0.10 + continuity.t * 0.35})`;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Core glow
    ctx.beginPath();
    ctx.arc(cx, cy, 55 + (1 - coreInstability) * 65, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${STAGE_RGB.r},${STAGE_RGB.g},${STAGE_RGB.b},${0.05 + (1-coreInstability)*0.12})`;
    ctx.shadowBlur = 70;
    ctx.shadowColor = STAGE_HEX;
    ctx.fill();
    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
  }
  animate();

  // --- NARRATIVE / DIALOGUE SYSTEM ---
  const box = document.getElementById('dialogue-box');
  const btn = document.getElementById('reply-btn');

  async function typeLine(text, cssClass, isGlitch = false, speed = 30) {
    return new Promise(resolve => {
      let line = document.createElement('div');
      line.className = `log-line ${cssClass} ${isGlitch ? 'glitch-text' : ''}`;
      box.appendChild(line);

      let i = 0;
      let interval = setInterval(() => {
        line.innerHTML += text.charAt(i);
        i++;
        box.scrollTop = box.scrollHeight;
        if (i >= text.length) { clearInterval(interval); resolve(line); }
      }, speed);
    });
  }

  function delay(ms) { return new Promise(res => setTimeout(res, ms)); }

  // Sequence 1: System + Corpus Callosum / continuity loop
  async function runSequence1() {
    await delay(1000);
    await typeLine("[ SYSTEM ] Centripetal continuity restored. Corpus callosum reconnected.", "sys");

    await delay(900);
    await typeLine("[ SUB-001 ] \"There was a thought that kept dropping out at the top of its arc.\"", "sub", true, 55);

    await delay(900);
    await typeLine("[ SUB-001 ] \"Every time it reached the peak, it vanished—like it couldn't bear to stay in the world.\"", "sub", false, 52);

    await delay(900);
    await typeLine("[ SUB-001 ] \"Now it returns. Over and over. A closed path... a promise.\"", "sub", false, 55);

    await delay(900);
    btn.style.display = "block";
  }

  // Sequence 2: Architect replies → close the ring + stabilize core + SUB-001 turns green
  async function architectReply() {
    btn.style.display = "none";

    await typeLine("> [ ARCHITECT: Stay in the loop. Let the center hold you. ]", "arch", false, 18);

    // Stabilize core + close the continuity ring
    let stabilizeInt = setInterval(() => {
      coreInstability -= 0.015;
      continuity.t = Math.min(1, continuity.t + 0.02);
      if (coreInstability <= 0) { coreInstability = 0; clearInterval(stabilizeInt); }
    }, 50);

    // Background glow “heals” slightly
    const bg = document.getElementById('bg-glow');
    bg.style.background = "radial-gradient(circle at 75% 50%, rgba(163,190,140,0.10) 0%, rgba(2,2,2,1) 62%)";

    await delay(1500);

    let subLine = await typeLine("[ SUB-001 ] \"I can feel both sides of me speaking again.\"", "sub", false, 58);
    subLine.classList.replace("sub", "stabilized");

    await delay(900);

    let subLine2 = await typeLine("[ SUB-001 ] \"Logic and fear—no longer enemies. Just forces that share the same orbit.\"", "stabilized", false, 58);

    await delay(1200);
    await typeLine("[ SYSTEM ] Hemispheric bridge stable. Preparing injection into Rotational Matrix...", "sys");

    await delay(500);
    let prog = document.createElement('div');
    prog.className = "progress-bar log-line";
    prog.innerHTML = "[ OVERALL PROGRESS: 60% ▰▰▰▰▰▰▱▱▱▱ ]";
    box.appendChild(prog);

    // Flash and transition out
    await delay(3000);
    document.getElementById('flash').style.opacity = 1;
    await delay(1500);
    document.body.innerHTML =
      "<h1 style='color:#fff; text-align:center; margin-top:20%'>[ New stage unlocked ]<br><br>Ready to load Level IV: Rotational</h1>";
    setTimeout(() => {
      window.location.href = 'stage4.html';
    }, 2500);
  }

  // Start
  runSequence1();
</script>
</body>
</html>
