<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intermission 1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@200;300;400&display=swap');

        :root {
            --bg: #020202; 
            --sys-color: #88c0d0;  /* Cyan for System/Stage 1 */
            --sub-color: #bf616a;  /* Red for Unstable Subject 001 */
            --arch-color: #ebcb8b; /* Gold for Architect (You) */
            --text-main: #eceff4;
            --font-mono: 'Space Mono', monospace;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg); overflow: hidden;
            font-family: var(--font-mono); color: var(--text-main);
            user-select: none;
            opacity: 0; transition: opacity 1.5s ease;
        }

        /* Ambient Overlays */
        #bg-glow { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 75% 50%, rgba(136,192,208,0.05) 0%, rgba(2,2,2,1) 60%); z-index: 0; transition: 2s; }
        .scanlines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px); pointer-events: none; z-index: 3; }
        #vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; box-shadow: inset 0 0 150px rgba(0,0,0,0.8); z-index: 2; }
        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* Terminal UI */
        #terminal-container {
            position: absolute; left: 8%; top: 50%; transform: translateY(-50%);
            width: 45%; z-index: 10; font-size: 1.1vw; line-height: 2;
        }

        .inter-title {
            font-family: 'Inter', sans-serif; font-weight: 200; font-size: 1.5vw; letter-spacing: 5px; 
            color: var(--text-main); margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px;
        }

        .log-line { margin-bottom: 10px; opacity: 0; animation: fadeIn 0.1s forwards; text-shadow: 0 0 8px rgba(255,255,255,0.2); }
        .sys { color: var(--sys-color); }
        .sub { color: var(--sub-color); text-shadow: 0 0 10px var(--sub-color); }
        .arch { color: var(--arch-color); }
        .stabilized { color: #a3be8c; text-shadow: 0 0 10px #a3be8c; transition: color 1s; }

        /* Glitch effect for Subject 001 panic */
        .glitch-text { display: inline-block; animation: textGlitch 0.3s infinite; }
        @keyframes textGlitch {
            0% { transform: translate(0); opacity: 1; }
            20% { transform: translate(-2px, 1px); opacity: 0.8; }
            40% { transform: translate(2px, -1px); opacity: 0.9; }
            60% { transform: translate(-1px, -2px); opacity: 1; }
            80% { transform: translate(1px, 2px); opacity: 0.8; }
            100% { transform: translate(0); opacity: 1; }
        }

        @keyframes fadeIn { to { opacity: 1; } }

        /* Interactive Architect Button */
        #reply-btn {
            display: none; margin-top: 20px; background: rgba(235, 203, 139, 0.05); 
            border: 1px solid var(--arch-color); color: var(--arch-color); 
            padding: 15px 20px; font-family: var(--font-mono); font-size: 1vw; 
            cursor: pointer; text-align: left; width: 100%; transition: 0.3s;
            box-shadow: 0 0 10px rgba(235, 203, 139, 0.2);
        }
        #reply-btn:hover { background: rgba(235, 203, 139, 0.2); box-shadow: 0 0 20px rgba(235, 203, 139, 0.5); transform: translateX(10px); }
        
        .progress-bar { font-size: 1.2vw; letter-spacing: 5px; color: var(--text-main); margin-top: 30px; display: inline-block; background: rgba(255,255,255,0.05); padding: 10px 20px; border-left: 2px solid var(--sys-color); }

    </style>
</head>
<body>

    <div id="bg-glow"></div>
    <div class="scanlines"></div>
    <div id="vignette"></div>
    <div id="flash"></div>
    
    <canvas id="main-canvas"></canvas>

    <div id="terminal-container">
        <div class="inter-title">[ NEURAL RECONSTRUCTION LOG ]</div>
        <div id="dialogue-box"></div>
        <button id="reply-btn" onclick="architectReply()">> [ ARCHITECT: Stabilize yourself. You are being uploaded. ]</button>
    </div>

<script>
    window.addEventListener('load', () => {
        document.documentElement.style.opacity = '1';
        document.body.style.opacity = '1';
    });

    // --- 3D ENGINE (Render the "Core") ---
    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d');
    let w, h, cx, cy;
    let time = 0;
    
    // Core state
    let coreInstability = 1.0; // 1.0 = highly chaotic, 0.0 = perfectly smooth
    let geometry = [];
    
    function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; cx = w * 0.75; cy = h / 2; }
    window.addEventListener('resize', resize); resize();

    const FOV = 600; const VIEW_DIST = 5;
    function rotate3D(x, y, z, rx, ry, rz) {
        let cy1 = Math.cos(rx), sy1 = Math.sin(rx); let y1 = y*cy1 - z*sy1; let z1 = y*sy1 + z*cy1;
        let cx2 = Math.cos(ry), sx2 = Math.sin(ry); let x2 = x*cx2 + z1*sx2; let z2 = -x*sx2 + z1*cx2;
        let cx3 = Math.cos(rz), sx3 = Math.sin(rz); let x3 = x2*cx3 - y1*sx3; let y3 = x2*sx3 + y1*cx3;
        return { x: x3, y: y3, z: z2 };
    }
    function project(x, y, z) { let s = FOV / (FOV + z + VIEW_DIST); return { x: cx + x * s * 250, y: cy + y * s * 250, s }; }

    // Generate wireframe sphere/core
    for(let i=0; i<200; i++) {
        let phi = Math.acos(1 - 2*(i+0.5)/200);
        let theta = Math.PI * (1 + Math.sqrt(5)) * i;
        geometry.push({ x: Math.sin(phi)*Math.cos(theta), y: Math.sin(phi)*Math.sin(theta), z: Math.cos(phi) });
    }

    function animate() {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(2, 2, 2, 0.3)';
        ctx.fillRect(0, 0, w, h);
        
        ctx.globalCompositeOperation = 'lighter';
        time += 0.02;

        // Rotation speed depends on instability
        let rX = time * (0.2 + coreInstability*0.8);
        let rY = time * (0.3 + coreInstability*0.5);

        ctx.beginPath();
        geometry.forEach((p, i) => {
            // Chaos jitter
            let jX = (Math.random()-0.5) * 0.2 * coreInstability;
            let jY = (Math.random()-0.5) * 0.2 * coreInstability;
            let jZ = (Math.random()-0.5) * 0.2 * coreInstability;

            let r = rotate3D(p.x + jX, p.y + jY, p.z + jZ, rX, rY, 0);
            let pj = project(r.x, r.y, r.z);
            if(pj.s > 0) {
                if(i===0) ctx.moveTo(pj.x, pj.y);
                else if(i%3 === 0) ctx.lineTo(pj.x, pj.y);
                
                // Draw nodes
                ctx.fillStyle = `rgba(136,192,208,${0.3 + (1-coreInstability)*0.5})`;
                ctx.fillRect(pj.x, pj.y, pj.s*3, pj.s*3);
            }
        });
        ctx.strokeStyle = `rgba(136,192,208,${0.1 + (1-coreInstability)*0.3})`;
        ctx.lineWidth = 1; ctx.stroke();

        // Core glow
        ctx.beginPath(); ctx.arc(cx, cy, 50 + (1-coreInstability)*50, 0, Math.PI*2);
        ctx.fillStyle = `rgba(136,192,208,${0.05 + (1-coreInstability)*0.1})`;
        ctx.shadowBlur = 50; ctx.shadowColor = '#88c0d0'; ctx.fill(); ctx.shadowBlur = 0;

        requestAnimationFrame(animate);
    }
    animate();

    // --- NARRATIVE / DIALOGUE SYSTEM ---
    const box = document.getElementById('dialogue-box');
    const btn = document.getElementById('reply-btn');

    async function typeLine(text, cssClass, isGlitch = false, speed = 30) {
        return new Promise(resolve => {
            let line = document.createElement('div');
            line.className = `log-line ${cssClass} ${isGlitch ? 'glitch-text' : ''}`;
            box.appendChild(line);
            
            let i = 0;
            let interval = setInterval(() => {
                line.innerHTML += text.charAt(i);
                i++;
                // Auto scroll to bottom
                box.scrollTop = box.scrollHeight;
                if(i >= text.length) { clearInterval(interval); resolve(line); }
            }, speed);
        });
    }

    function delay(ms) { return new Promise(res => setTimeout(res, ms)); }

    // Sequence 1: System and Panic
    async function runSequence1() {
        await delay(1000);
        await typeLine("[ SYSTEM ] Torque Override Successful. Motor Cortex brought online.", "sys");
        await delay(800);
        await typeLine("[ SUB-001 ] \"...c-cold... where am I? My hands... I can't feel myself!\"", "sub", true, 40);
        await delay(1000);
        await typeLine("[ SUB-001 ] \"The world is dissolving... it's tearing me apart!\"", "sub", true, 50);
        await delay(1000);
        btn.style.display = "block"; // Show player choice
    }

    // Sequence 2: Architect Replies (Triggered by button)
    async function architectReply() {
        btn.style.display = "none";
        
        // Architect text
        await typeLine("> [ ARCHITECT: Stabilize your mind. You are being uploaded. ]", "arch", false, 20);
        
        // The visual geometry literally stabilizes!
        let stabilizeInt = setInterval(() => {
            coreInstability -= 0.02;
            if(coreInstability <= 0) { coreInstability = 0; clearInterval(stabilizeInt); }
        }, 50);

        await delay(1500);

        // Sub-001 calms down (No glitch, color transitions to green/stable)
        let subLine = await typeLine("[ SUB-001 ] \"Uploaded? Wait... who are you? What are you doing to me?\"", "sub", false, 60);
        subLine.classList.replace("sub", "stabilized");

        await delay(1200);
        await typeLine("[ SYSTEM ] Neural link stabilizing. Preparing injection into Momentum Space...", "sys");
        
        await delay(500);
        let prog = document.createElement('div');
        prog.className = "progress-bar log-line";
        prog.innerHTML = "[ OVERALL PROGRESS: 20% ▰▰▱▱▱▱▱▱▱▱ ]";
        box.appendChild(prog);

        // Flash and transition out
        await delay(3000);
        document.getElementById('flash').style.opacity = 1;
        await delay(1500);
        document.body.innerHTML = "<h1 style='color:#fff; text-align:center; margin-top:20%'>[ New stage unlocked ]</h1>";
        setTimeout(() => {
            window.location.href = 'stage2.html';
        }, 2500);
    }

    // Start the show
    runSequence1();

</script>
</body>
</html>
